server {
    listen 127.0.0.1:5008 ssl;
    http2 on;
    server_name api.belidong.top;

    ssl_certificate /root/cert/belidong.top/fullchain.pem;
    ssl_certificate_key /root/cert/belidong.top/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
